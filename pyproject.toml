[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "any-watch-suite"
version = "1.0.0.0"
description = "Universal terminal streaming suite — Movies, TV, Anime & Asian Drama"
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "any-watch>=1.0.0.0",
]

[project.scripts]
any-watch = "any_watch.cli:main"
any-watch-flix = "any_watch_flix.cli:main"
any-watch-anime = "any_watch_anime.cli:main"
any-watch-drama = "any_watch_drama.cli:main"

[tool.uv.workspace]
members = [
    "packages/any-watch-core",
    "packages/any-watch-flix",
    "packages/any-watch-anime",
    "packages/any-watch-drama",
    "packages/any-watch",
]

[tool.uv.sources]
any-watch-core = { workspace = true }
any-watch-flix = { workspace = true }
any-watch-anime = { workspace = true }
any-watch-drama = { workspace = true }
any-watch = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["packages/any-watch/any_watch"]
