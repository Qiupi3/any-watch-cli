[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "any-watch-drama"
version = "1.0.0.0"
description = "Stream KDrama, CDrama, and Asian drama via KissKH, NaraShika, Nontongo, DramaSerial, and Drakorindo"
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "any-watch-core>=1.0.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
any-watch-drama = "any_watch_drama.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["any_watch_drama"]
