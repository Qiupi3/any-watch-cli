[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "any-watch-anime"
version = "1.0.0"
description = "Stream Anime via HiAnime with subtitle extraction"
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "any-watch-core>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
any-watch-anime = "any_watch_anime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["any_watch_anime"]
