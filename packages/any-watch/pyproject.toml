[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "any-watch"
version = "1.1.0"
description = "Universal terminal streaming suite — Movies, TV, Anime & Asian Drama"
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "any-watch-core>=1.1.0",
    "any-watch-flix>=1.1.0",
    "any-watch-anime>=1.1.0",
    "any-watch-drama>=1.1.0",
]

[project.scripts]
any-watch = "any_watch.cli:main"
any-watch-flix = "any_watch_flix.cli:main"
any-watch-anime = "any_watch_anime.cli:main"
any-watch-drama = "any_watch_drama.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["any_watch"]
