[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "any-watch-flix"
version = "1.0.0.0"
description = "Stream movies and Western TV via FlixHQ, LK21, and IDLIX"
license = { text = "GPLv3" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "any-watch-core>=1.0.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
any-watch-flix = "any_watch_flix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["any_watch_flix"]
